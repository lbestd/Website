<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/xterm.css">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #topbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            height: 44px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        #topbar a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 14px; }
        #topbar a:hover { color: #fff; }
        #topbar-divider { color: rgba(255,255,255,0.4); }
        #app-title { font-weight: 600; color: white; font-size: 15px; }
        #status {
            margin-left: auto;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #a6e3a1;
            flex-shrink: 0;
        }
        #status-dot.error { background: #f38ba8; }
        #status-dot.connecting { background: #f9e2af; }

        #terminal-wrap {
            flex: 1;
            padding: 6px;
            overflow: hidden;
            display: flex;
            min-height: 0;
        }
        #terminal { width: 100%; height: 100%; }
        .xterm { height: 100%; }
        .xterm-viewport { overflow-y: scroll !important; }
    </style>
</head>
<body>
    <div id="topbar">
        <a href="/">← Меню</a>
        <span id="topbar-divider">/</span>
        <span id="app-title">💻 Терминал</span>
        <div id="status">
            <span id="status-dot" class="connecting"></span>
            <span id="status-text">подключение…</span>
        </div>
    </div>
    <div id="terminal-wrap">
        <div id="terminal"></div>
    </div>

    <script src="/static/xterm.js"></script>
    <script src="/static/xterm-addon-fit.js"></script>
    <script>
    const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "'Menlo', 'Consolas', 'Monaco', 'Courier New', monospace",
        scrollback: 5000,
        theme: {
            background:    '#1e1e2e',
            foreground:    '#cdd6f4',
            cursor:        '#cba6f7',
            cursorAccent:  '#1e1e2e',
            selectionBackground: '#45475a',
            black:         '#45475a',
            red:           '#f38ba8',
            green:         '#a6e3a1',
            yellow:        '#f9e2af',
            blue:          '#89b4fa',
            magenta:       '#cba6f7',
            cyan:          '#89dceb',
            white:         '#bac2de',
            brightBlack:   '#585b70',
            brightRed:     '#f38ba8',
            brightGreen:   '#a6e3a1',
            brightYellow:  '#f9e2af',
            brightBlue:    '#89b4fa',
            brightMagenta: '#cba6f7',
            brightCyan:    '#89dceb',
            brightWhite:   '#a6adc8',
        },
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');

    function setStatus(state, msg) {
        dot.className = state;
        text.textContent = msg;
    }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/terminal/ws`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        setStatus('', 'подключено');
        dot.style.background = '#a6e3a1';
        sendResize();
        term.focus();
    };

    ws.onmessage = (event) => {
        if (event.data instanceof ArrayBuffer) {
            term.write(new Uint8Array(event.data));
        } else {
            term.write(event.data);
        }
    };

    ws.onclose = () => {
        setStatus('error', 'отключено');
    };

    ws.onerror = () => {
        setStatus('error', 'ошибка соединения');
    };

    term.onData(data => {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send(data);
        }
    });

    function sendResize() {
        fitAddon.fit();
        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
    }

    const ro = new ResizeObserver(() => sendResize());
    ro.observe(document.getElementById('terminal-wrap'));
    </script>
</body>
</html>
