<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/easymde.min.css">
    <script src="/static/easymde.min.js"></script>
    <style>
        /* ── Theme variables ── */
        :root {
            --bg: #1e1e2e;
            --bg-alt: #181825;
            --bg-darker: #11111b;
            --surface0: #313244;
            --surface1: #45475a;
            --surface2: #585b70;
            --overlay0: #6c7086;
            --subtext0: #a6adc8;
            --text: #e9ecf6;
            --mauve: #cba6f7;
            --blue: #89b4fa;
            --red: #f38ba8;
            --green: #a6e3a1;
            --peach: #fab387;
            --sky: #89dceb;
            --pink: #f5c2e7;
        }
        body.light {
            --bg: #fdfdfd;
            --bg-alt: #f6f6f6;
            --bg-darker: #dce0e8;
            --surface0: #ccd0da;
            --surface1: #bcc0cc;
            --surface2: #acb0be;
            --overlay0: #101011;
            --subtext0: #3c3c3c;
            --text: #1d1e26;
            --mauve: #8839ef;
            --blue: #1e66f5;
            --red: #d20f39;
            --green: #40a02b;
            --peach: #fe640b;
            --sky: #04a5e5;
            --pink: #ea76cb;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            height: 100vh; height: 100dvh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* ── Top bar ── */
        #topbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 0 16px; display: flex; align-items: center; gap: 12px;
            flex-shrink: 0; box-shadow: 0 2px 12px rgba(0,0,0,0.4); height: 44px;
        }
        #topbar a { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 14px; white-space: nowrap; }
        #topbar a:hover { color: #fff; }
        #topbar-divider { color: rgba(255,255,255,0.4); }
        #app-title { font-weight: 600; color: white; font-size: 15px; white-space: nowrap; }
        #topbar-spacer { flex: 1; }
        #theme-btn {
            background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
            color: white; padding: 5px 10px; border-radius: 8px; cursor: pointer;
            font-size: 14px; white-space: nowrap; transition: background 0.15s;
        }
        #theme-btn:hover { background: rgba(255,255,255,0.3); }
        #save-btn {
            background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
            color: white; padding: 5px 18px; border-radius: 8px; cursor: pointer;
            font-size: 13px; white-space: nowrap; transition: background 0.15s;
        }
        #save-btn:hover:not(:disabled) { background: rgba(255,255,255,0.3); }
        #save-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        #download-btn {
            background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
            color: white; padding: 5px 10px; border-radius: 8px; cursor: pointer;
            font-size: 14px; transition: background 0.15s;
        }
        #download-btn:hover:not(:disabled) { background: rgba(255,255,255,0.3); }
        #download-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        #save-status { font-size: 12px; white-space: nowrap; min-width: 90px; text-align: right; color: rgba(255,255,255,0.8); }
        #sync-btn {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.55); padding: 5px 10px; border-radius: 8px; cursor: pointer;
            font-size: 13px; white-space: nowrap; transition: background 0.15s, color 0.15s;
        }
        #sync-btn:hover { background: rgba(255,255,255,0.22); color: rgba(255,255,255,0.85); }
        #sync-btn.active {
            background: rgba(166,227,161,0.18); border-color: rgba(166,227,161,0.5);
            color: #a6e3a1;
        }

        /* ── Disk notification ── */
        #notification {
            background: var(--peach); color: #1e1e2e; padding: 7px 16px;
            display: flex; align-items: center; gap: 10px; font-size: 13px; flex-shrink: 0;
        }
        #notification.hidden { display: none; }
        #notification span { flex: 1; }
        #notification button {
            background: rgba(0,0,0,0.15); border: none; padding: 4px 14px;
            border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500;
        }
        #notification button:hover { background: rgba(0,0,0,0.25); }

        /* ── Layout ── */
        #layout { flex: 1; display: flex; overflow: hidden; }

        /* ── Sidebar ── */
        #sidebar {
            width: 260px; background: var(--bg-alt); border-right: 1px solid var(--surface0);
            display: flex; flex-direction: column; flex-shrink: 0;
            transition: width 0.25s ease; overflow: hidden;
        }
        #sidebar.collapsed { width: 0; }

        #sidebar-header {
            padding: 10px 12px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--surface0); flex-shrink: 0;
        }
        #sidebar-header span { font-size: 11px; font-weight: 600; color: var(--subtext0); letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; }
        .sb-btn {
            background: none; border: none; color: var(--surface2); cursor: pointer;
            font-size: 16px; line-height: 1; padding: 3px 5px; border-radius: 4px;
        }
        .sb-btn:hover { background: var(--surface0); color: var(--text); }
        #new-file-btn { font-size: 20px; }

        #new-file-row {
            display: flex; align-items: center; gap: 4px; padding: 6px 8px;
            border-bottom: 1px solid var(--surface0); flex-shrink: 0;
        }
        #new-file-row.hidden { display: none; }
        #new-file-input {
            flex: 1; min-width: 0; background: var(--surface0); border: 1px solid var(--surface1);
            color: var(--text); border-radius: 4px; padding: 4px 8px;
            font-size: 12px; font-family: monospace; outline: none;
        }
        #new-file-input:focus { border-color: var(--mauve); }
        #new-file-row button {
            background: none; border: none; color: var(--subtext0);
            cursor: pointer; font-size: 14px; padding: 3px 5px; border-radius: 3px;
        }
        #new-file-row button:hover { background: var(--surface0); color: var(--text); }

        #file-search {
            border: none; border-bottom: 1px solid var(--surface0); background: var(--bg);
            color: var(--text); padding: 7px 12px; font-size: 13px; outline: none; flex-shrink: 0;
        }
        #file-search::placeholder { color: var(--surface2); }

        #file-list { overflow-y: auto; flex: 1; padding: 4px 0; }

        /* ── File tree ── */
        .tree-folder {
            padding: 6px 12px; cursor: pointer; user-select: none;
            display: flex; align-items: center; gap: 5px;
            font-size: 13px; color: var(--blue); transition: background 0.1s;
        }
        .tree-folder:hover { background: var(--surface0); }
        .tree-arrow { font-size: 9px; color: var(--surface2); width: 10px; flex-shrink: 0; transition: transform 0.15s; }
        .tree-folder.open > .tree-arrow { transform: rotate(90deg); }
        .tree-children { padding-left: 14px; border-left: 1px solid var(--surface0); margin-left: 16px; }
        .tree-children.hidden { display: none; }

        .file-item {
            padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--subtext0);
            font-family: 'Menlo', 'Consolas', monospace; transition: background 0.1s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none;
            display: flex; align-items: center; gap: 6px;
        }
        .file-item:hover { background: var(--surface0); color: var(--text); }
        .file-item.active { background: var(--surface1); color: var(--mauve); }
        .file-item.hidden-item { display: none; }
        .tree-folder.hidden-item { display: none; }

        .sidebar-empty { padding: 16px 12px; color: var(--overlay0); font-size: 12px; line-height: 1.6; }

        #sidebar-toggle-float {
            display: none; position: fixed; left: 8px; top: 52px; z-index: 100;
            background: var(--surface0); border: 1px solid var(--surface1); color: var(--text);
            border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 16px;
        }
        #sidebar-toggle-float.visible { display: block; }

        /* ── Editor area ── */
        #editor-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        /* ── Tab bar ── */
        #tab-bar {
            display: flex; align-items: stretch; background: var(--bg-darker);
            border-bottom: 1px solid var(--surface0); flex-shrink: 0;
            overflow-x: auto; overflow-y: hidden; height: 36px; scrollbar-width: thin;
        }
        #tab-bar::-webkit-scrollbar { height: 3px; }
        #tab-bar::-webkit-scrollbar-thumb { background: var(--surface1); }
        .tab {
            display: flex; align-items: center; gap: 6px; padding: 0 12px;
            cursor: pointer; border-right: 1px solid var(--surface0); white-space: nowrap;
            font-size: 13px; color: var(--overlay0); font-family: monospace;
            user-select: none; flex-shrink: 0; min-width: 80px; max-width: 200px;
            transition: background 0.15s, color 0.15s;
        }
        .tab:hover { background: var(--bg); color: var(--text); }
        .tab.active { background: var(--bg); color: var(--text); border-bottom: 2px solid var(--mauve); }
        .tab-dirty { color: var(--red); font-size: 10px; flex-shrink: 0; }
        .tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .tab-close {
            background: none; border: none; color: var(--overlay0); cursor: pointer;
            font-size: 14px; line-height: 1; padding: 2px 3px; border-radius: 3px; flex-shrink: 0;
        }
        .tab-close:hover { background: var(--surface1); color: var(--red); }

        /* ── Empty state ── */
        #empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--overlay0); gap: 12px; padding: 32px;
        }
        #empty-state .es-icon { font-size: 52px; line-height: 1; }
        #empty-state p { font-size: 15px; }
        #empty-state small { font-size: 12px; }

        /* ── EasyMDE wrapper ── */
        #md-wrapper { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .EasyMDEContainer { flex: 1; display: flex; flex-direction: column; min-height: 0; height: 100%; }
        .EasyMDEContainer .CodeMirror {
            flex: 1; height: auto; min-height: 0; font-size: 15px; line-height: 1.7;
            background: var(--bg); color: var(--text); border: none; border-top: none !important;
            font-family: 'Menlo', 'Consolas', 'Monaco', monospace;
        }
        .EasyMDEContainer .CodeMirror-scroll { min-height: 0; }
        .EasyMDEContainer .CodeMirror-cursor { border-left-color: var(--mauve); }
        .EasyMDEContainer .CodeMirror-selected { background: var(--surface0) !important; }
        .EasyMDEContainer .CodeMirror-focused .CodeMirror-selected { background: var(--surface1) !important; }
        .editor-toolbar {
            background: var(--bg-alt) !important; border-bottom: 1px solid var(--surface0) !important; border-top: none !important; flex-shrink: 0;
        }
        .editor-toolbar button { color: var(--text) !important; }
        .editor-toolbar button:hover, .editor-toolbar button.active {
            background: var(--surface0) !important; border-color: var(--surface1) !important; color: var(--text) !important;
        }
        .editor-toolbar i.separator { border-color: var(--surface0) !important; }
        .editor-toolbar.disabled-for-preview button:not(.no-disable) { color: var(--surface2) !important; opacity: 0.5; }
        .editor-preview, .editor-preview-side {
            background: var(--bg-alt); color: var(--text); border-left: 1px solid var(--surface0);
            padding: 20px 24px; line-height: 1.7; overflow: auto;
        }
        /* Restore spacing destroyed by the CSS reset */
        .editor-preview p, .editor-preview-side p { margin-bottom: 1em; }
        .editor-preview ul, .editor-preview-side ul { list-style: disc;    padding-left: 2em; margin-bottom: 1em; }
        .editor-preview ol, .editor-preview-side ol { list-style: decimal; padding-left: 2em; margin-bottom: 1em; }
        .editor-preview li, .editor-preview-side li { margin-bottom: 0.3em; }
        .editor-preview li > ul, .editor-preview li > ol,
        .editor-preview-side li > ul, .editor-preview-side li > ol { margin-top: 0.3em; margin-bottom: 0; }
        .editor-preview h1, .editor-preview h2, .editor-preview h3,
        .editor-preview h4, .editor-preview h5, .editor-preview h6,
        .editor-preview-side h1, .editor-preview-side h2, .editor-preview-side h3 {
            color: #0b080f; border-bottom: 1px solid var(--surface0);
            padding-bottom: 4px; margin-top: 1.4em; margin-bottom: 0.6em;
        }
        .editor-preview h1:first-child, .editor-preview-side h1:first-child { margin-top: 0; }
        .editor-preview pre, .editor-preview-side pre { background: var(--bg-darker); border: 1px solid var(--surface0); border-radius: 6px; padding: 12px; margin-bottom: 1em; overflow-x: auto; }
        .editor-preview code, .editor-preview-side code { background: var(--bg-darker); color: #0b080f; padding: 2px 5px; border-radius: 3px; font-family: 'Menlo','Consolas',monospace; font-size: 0.9em; }
        .editor-preview pre code, .editor-preview-side pre code { background: none; color: inherit; padding: 0; border-radius: 0; }
        .editor-preview blockquote, .editor-preview-side blockquote { border-left: 3px solid var(--surface2); padding-left: 16px; margin: 1em 0; color: var(--subtext0); }
        .editor-preview hr, .editor-preview-side hr { border: none; border-top: 1px solid var(--surface1); margin: 1.5em 0; }
        .editor-preview img, .editor-preview-side img { max-width: 100%; }
        .editor-preview a, .editor-preview-side a { color: var(--blue); }
        .editor-preview table, .editor-preview-side table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
        .editor-preview th, .editor-preview td, .editor-preview-side th, .editor-preview-side td { border: 1px solid var(--surface0); padding: 6px 12px; }
        .editor-preview th, .editor-preview-side th { background: var(--surface0); }

        /* ── CodeMirror wrapper (py/txt) ── */
        #py-wrapper { flex: 1; display: none; flex-direction: column; min-height: 0; overflow: hidden; }
        #cm-editor { flex: 1; min-height: 0; height: 0; } /* height:0 + flex:1 = fills parent */
        #py-wrapper .CodeMirror {
            height: 100%; font-size: 15px; line-height: 1.7;
            background: var(--bg); color: var(--text);
            font-family: 'Menlo', 'Consolas', 'Monaco', monospace;
            border: none;
        }
        #py-wrapper .CodeMirror-gutters { background: var(--bg-alt); border-right: 1px solid var(--surface0); }
        #py-wrapper .CodeMirror-linenumber { color: var(--overlay0); padding: 0 8px; }
        #py-wrapper .CodeMirror-cursor { border-left: 2px solid var(--mauve); }
        #py-wrapper .CodeMirror-selected { background: var(--surface0) !important; }
        #py-wrapper .CodeMirror-focused .CodeMirror-selected { background: var(--surface1) !important; }
        #py-wrapper .CodeMirror-scroll { overflow: auto !important; }

        /* ── draw.io wrapper ── */
        #drawio-wrapper { flex: 1; display: none; overflow: hidden; }
        #drawio-frame { width: 100%; height: 100%; border: none; display: block; }

        /* ── Syntax token colors (shared) ── */
        .cm-header { color: var(--mauve) !important; font-weight: bold; }
        .cm-strong { color: var(--peach) !important; font-weight: bold; }
        .cm-em { color: var(--green) !important; font-style: italic; }
        .cm-link { color: var(--blue) !important; }
        .cm-url { color: var(--sky) !important; }
        .cm-comment { color: var(--overlay0) !important; font-style: italic; }
        .cm-string, .cm-string-2 { color: var(--green) !important; }
        .cm-keyword { color: var(--mauve) !important; }
        .cm-def { color: var(--blue) !important; }
        .cm-builtin { color: var(--red) !important; }
        .cm-atom { color: var(--peach) !important; }
        .cm-number { color: var(--peach) !important; }
        .cm-operator { color: var(--sky) !important; }
        .cm-variable { color: var(--text) !important; }
        .cm-variable-2 { color: var(--text) !important; }
        .cm-meta { color: var(--pink) !important; }
        .cm-error { color: var(--red) !important; }
        .cm-quote { color: var(--subtext0) !important; }

        /* ── Scrollbars ── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--surface2); }

        @media (max-width: 540px) {
            #sync-btn { display: none; }
            #save-status { display: none; }
            #app-title { font-size: 13px; }
            #topbar { gap: 6px; padding: 0 8px; }
            #save-btn { padding: 5px 10px; }
            #download-btn { padding: 5px 7px; }
            #theme-btn { padding: 5px 7px; }
        }
    </style>
</head>
<body>
    <div id="topbar">
        <a href="/">← Меню</a>
        <span id="topbar-divider">/</span>
        <span id="app-title">📝 Блокнот</span>
        <span id="topbar-spacer"></span>
        <button id="sync-btn" onclick="toggleSync()" title="Синхронизация изменений с диска">⟳ Синхронизация</button>
        <button id="theme-btn" onclick="toggleTheme()" title="Переключить тему">☀️</button>
        <button id="save-btn" onclick="saveFile()" disabled>Сохранить</button>
        <button id="download-btn" onclick="downloadFile()" disabled title="Скачать файл">⬇</button>
        <span id="save-status"></span>
    </div>

    <div id="notification" class="hidden">
        <span>⚠️ Файл изменился на диске</span>
        <button onclick="reloadFromDisk()">Обновить</button>
        <button onclick="dismissNotification()" style="background:rgba(0,0,0,0.08)">✕</button>
    </div>

    <button id="sidebar-toggle-float" onclick="toggleSidebar()" title="Показать файлы">→</button>

    <div id="layout">
        <aside id="sidebar">
            <div id="sidebar-header">
                <span>📁 Файлы</span>
                <div style="display:flex;gap:2px;align-items:center">
                    <button class="sb-btn" id="new-file-btn" onclick="showNewFileForm()" title="Создать файл">+</button>
                    <button class="sb-btn" id="toggle-sidebar" onclick="toggleSidebar()" title="Скрыть панель">←</button>
                </div>
            </div>
            <div id="new-file-row" class="hidden">
                <input type="text" id="new-file-input" placeholder="имя.md, имя.py, имя.puml или имя.drawio"
                       onkeydown="handleNewFileKey(event)">
                <button onclick="createFile()" title="Создать">✓</button>
                <button onclick="cancelNewFile()" title="Отмена">✕</button>
            </div>
            <input id="file-search" type="text" placeholder="Поиск..." oninput="filterTree(this.value)">
            <div id="file-list"></div>
        </aside>

        <div id="editor-area">
            <div id="tab-bar"></div>
            <div id="empty-state">
                <span class="es-icon">📝</span>
                <p>Выберите файл для редактирования</p>
                <small>Ctrl+S — сохранить</small>
            </div>
            <div id="md-wrapper">
                <textarea id="editor"></textarea>
            </div>
            <div id="py-wrapper">
                <div id="cm-editor"></div>
            </div>
            <div id="drawio-wrapper">
                <iframe id="drawio-frame" src="" allow="clipboard-read; clipboard-write"></iframe>
            </div>
        </div>
    </div>

    <script>
    // ── File list from server ─────────────────────────────────────────────────
    const ALL_FILES = {{ files | tojson }};

    // ── State ─────────────────────────────────────────────────────────────────
    let easyMDE = null;
    let cmEditor = null;
    let currentFile = null;
    let pythonModeReady = null; // Promise, resolved after cm-python.min.js loads
    let pendingDiskContent = null;
    let sidebarCollapsed = window.innerWidth < 600;
    let loading = false;
    let draftTimer = null;
    let syncEnabled = false;
    const tabs = new Map(); // path → { content, dirty, history }

    // ── localStorage ──────────────────────────────────────────────────────────
    const LS = 'np:';
    const persistDraft  = (p, c) => localStorage.setItem(LS + 'draft:' + p, c);
    const clearDraft    = (p)    => localStorage.removeItem(LS + 'draft:' + p);
    const getDraft      = (p)    => localStorage.getItem(LS + 'draft:' + p);
    function persistSession() {
        localStorage.setItem(LS + 'tabs', JSON.stringify([...tabs.keys()]));
        if (currentFile) localStorage.setItem(LS + 'current', currentFile);
    }

    // ── Theme ─────────────────────────────────────────────────────────────────
    function applyTheme(theme) {
        const isLight = theme === 'light';
        document.body.classList.toggle('light', isLight);
        document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
        localStorage.setItem(LS + 'theme', theme);
        requestAnimationFrame(() => {
            if (easyMDE) easyMDE.codemirror.refresh();
            if (cmEditor) cmEditor.refresh();
        });
    }
    function toggleTheme() {
        applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
        // Reload draw.io iframe with new theme if it was initialized
        if (drawioReady || drawioInitializing) {
            drawioReady = false;
            drawioInitializing = false;
            if (currentFile && isDrawio(currentFile)) initDrawioFrame();
            else { document.getElementById('drawio-frame').src = ''; }
        }
    }

    // ── File type helpers ─────────────────────────────────────────────────────
    const ext      = (p) => p.split('.').pop().toLowerCase();
    const isMd     = (p) => ext(p) === 'md';
    const isPy     = (p) => ext(p) === 'py';
    const isDrawio = (p) => ext(p) === 'drawio';

    function fileIcon(name) {
        const e = ext(name);
        if (e === 'md')     return '📝';
        if (e === 'py')     return '🐍';
        if (e === 'puml')   return '📐';
        if (e === 'drawio') return '📊';
        return '📄';
    }

    // ── draw.io state ─────────────────────────────────────────────────────────
    let drawioReady = false;
    let drawioInitializing = false;
    let drawioLoadedPath = null;

    function initDrawioFrame() {
        if (drawioInitializing) return;
        drawioReady = false;
        drawioInitializing = true;
        const dark = document.body.classList.contains('light') ? '0' : '1';
        document.getElementById('drawio-frame').src =
            `/static/drawio/index.html?embed=1&spin=1&modified=unsavedChanges&stealth=1&dark=${dark}&proto=json&lang=ru`;
    }

    function sendDrawioLoad(path, xml) {
        drawioLoadedPath = path;
        const content = xml || '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>';
        document.getElementById('drawio-frame').contentWindow
            .postMessage(JSON.stringify({ action: 'load', xml: content, autosave: 1 }), '*');
    }

    window.addEventListener('message', (event) => {
        let msg;
        try { msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch { return; }
        if (!msg || !msg.event) return;

        if (msg.event === 'init') {
            drawioReady = true;
            drawioInitializing = false;
            if (currentFile && isDrawio(currentFile)) {
                const tab = tabs.get(currentFile);
                if (tab) sendDrawioLoad(currentFile, tab.content);
            }
        } else if (msg.event === 'autosave') {
            if (drawioLoadedPath && tabs.has(drawioLoadedPath)) {
                tabs.get(drawioLoadedPath).content = msg.xml;
                if (drawioLoadedPath === currentFile) {
                    tabs.get(drawioLoadedPath).dirty = true;
                    renderTabs();
                    setSaveStatus('● не сохранено', '#f38ba8');
                    clearTimeout(draftTimer);
                    draftTimer = setTimeout(() => persistDraft(drawioLoadedPath, msg.xml), 800);
                }
            }
        } else if (msg.event === 'save') {
            if (drawioLoadedPath && tabs.has(drawioLoadedPath)) {
                tabs.get(drawioLoadedPath).content = msg.xml;
                if (drawioLoadedPath === currentFile) saveFile();
                else { tabs.get(drawioLoadedPath).dirty = true; renderTabs(); }
            }
        }
    });

    // ── File tree ─────────────────────────────────────────────────────────────
    function buildTree(paths) {
        // Returns nested { dirs: {name→node}, files: [{name, path}] }
        const root = { dirs: {}, files: [] };
        for (const path of paths) {
            const parts = path.split('/');
            let node = root;
            for (let i = 0; i < parts.length - 1; i++) {
                const d = parts[i];
                if (!node.dirs[d]) node.dirs[d] = { dirs: {}, files: [] };
                node = node.dirs[d];
            }
            node.files.push({ name: parts[parts.length - 1], path });
        }
        return root;
    }

    function renderTree(node, container, depth = 0) {
        // Folders first (sorted), then files (sorted)
        for (const [name, child] of Object.entries(node.dirs).sort()) {
            const folderWrap = document.createElement('div');
            folderWrap.dataset.folder = name;

            const folderRow = document.createElement('div');
            folderRow.className = 'tree-folder';
            folderRow.innerHTML = `<span class="tree-arrow">▶</span><span>📁 ${name}</span>`;
            folderRow.onclick = () => {
                folderRow.classList.toggle('open');
                childrenDiv.classList.toggle('hidden');
            };

            const childrenDiv = document.createElement('div');
            childrenDiv.className = 'tree-children hidden';
            renderTree(child, childrenDiv, depth + 1);

            folderWrap.appendChild(folderRow);
            folderWrap.appendChild(childrenDiv);
            container.appendChild(folderWrap);
        }
        for (const { name, path } of node.files.sort((a, b) => a.name.localeCompare(b.name))) {
            const div = document.createElement('div');
            div.className = 'file-item';
            div.dataset.path = path;
            div.innerHTML = `<span>${fileIcon(name)}</span><span>${name}</span>`;
            div.title = path;
            div.onclick = () => openFile(path);
            container.appendChild(div);
        }
    }

    function initTree() {
        const container = document.getElementById('file-list');
        container.innerHTML = '';
        if (!ALL_FILES.length) {
            container.innerHTML = '<div class="sidebar-empty">Нет файлов .md, .txt или .py в папке.</div>';
            return;
        }
        const tree = buildTree(ALL_FILES);
        renderTree(tree, container);
    }

    function expandToFile(path) {
        // Expand all parent folders that contain this file
        const parts = path.split('/');
        if (parts.length < 2) return;
        const fileList = document.getElementById('file-list');
        let node = fileList;
        for (let i = 0; i < parts.length - 1; i++) {
            const folderWrap = [...node.children].find(el => el.dataset.folder === parts[i]);
            if (!folderWrap) break;
            const folderRow = folderWrap.querySelector('.tree-folder');
            const childrenDiv = folderWrap.querySelector('.tree-children');
            if (folderRow && !folderRow.classList.contains('open')) {
                folderRow.classList.add('open');
                childrenDiv.classList.remove('hidden');
            }
            node = childrenDiv || node;
        }
    }

    function highlightFileInTree(path) {
        document.querySelectorAll('.file-item').forEach(el => {
            el.classList.toggle('active', el.dataset.path === path);
            if (el.dataset.path === path) {
                expandToFile(path);
                el.scrollIntoView({ block: 'nearest' });
            }
        });
    }

    function filterTree(query) {
        const q = query.toLowerCase().trim();
        if (!q) {
            document.querySelectorAll('.file-item, .tree-folder, .tree-children').forEach(el => {
                el.classList.remove('hidden-item');
                if (el.classList.contains('tree-children')) el.classList.add('hidden');
                if (el.classList.contains('tree-folder')) el.classList.remove('open');
            });
            return;
        }
        // Show matching files and their parent folders
        document.querySelectorAll('.file-item').forEach(el => {
            const match = el.dataset.path.toLowerCase().includes(q);
            el.classList.toggle('hidden-item', !match);
            if (match) {
                // Expand parent chain
                let parent = el.parentElement;
                while (parent && parent.id !== 'file-list') {
                    if (parent.classList.contains('tree-children')) {
                        parent.classList.remove('hidden');
                        const row = parent.previousElementSibling;
                        if (row) row.classList.add('open');
                    }
                    parent = parent.parentElement;
                }
            }
        });
    }

    // ── Editor init ───────────────────────────────────────────────────────────
    function initMdEditor() {
        easyMDE = new EasyMDE({
            element: document.getElementById('editor'),
            autosave: { enabled: false },
            spellChecker: false,
            autofocus: false,
            toolbar: [
                'bold', 'italic', 'heading', '|',
                'quote', 'code', 'unordered-list', 'ordered-list', '|',
                'link', 'image', 'table', 'horizontal-rule', '|',
                'preview', 'side-by-side', 'fullscreen', '|', 'guide'
            ],
            renderingConfig: { singleLineBreaks: false },
            minHeight: '200px',
        });
        easyMDE.codemirror.on('change', onEditorChange);
        initPreviewScrollSync();
    }

    // ── Scroll sync for EasyMDE preview toggle ────────────────────────────────
    function initPreviewScrollSync() {
        const cm = easyMDE.codemirror;
        const elems = easyMDE.toolbarElements || {};

        [
            { btnName: 'preview',    previewSel: '.editor-preview',      activeClass: 'editor-preview-active' },
            { btnName: 'side-by-side', previewSel: '.editor-preview-side', activeClass: 'editor-preview-active-side' },
        ].forEach(({ btnName, previewSel, activeClass }) => {
            const btn = elems[btnName];
            if (!btn) return;

            let pending = null;

            // mousedown: CM is still visible, capture position
            btn.addEventListener('mousedown', () => {
                const el = document.querySelector(previewSel);
                if (!el) return;
                const opening = !el.classList.contains(activeClass);
                if (opening) {
                    const rect = cm.getWrapperElement().getBoundingClientRect();
                    const ch = cm.coordsChar({ left: rect.left + 4, top: rect.top + 4 }, 'window');
                    pending = { opening: true, frac: ch.line / Math.max(cm.lineCount() - 1, 1) };
                } else {
                    pending = { opening: false, frac: el.scrollHeight > 0 ? el.scrollTop / el.scrollHeight : 0 };
                }
            });

            // click: EasyMDE has toggled state; apply scroll
            btn.addEventListener('click', () => {
                if (!pending) return;
                const { opening, frac } = pending;
                pending = null;
                if (opening) {
                    // EasyMDE adds the class via setTimeout(1) — wait safely past that
                    setTimeout(() => {
                        const el = document.querySelector(previewSel);
                        if (el && el.scrollHeight > 0) el.scrollTop = frac * el.scrollHeight;
                    }, 20);
                } else {
                    const line = Math.round(frac * Math.max(cm.lineCount() - 1, 0));
                    cm.scrollIntoView({ line, ch: 0 }, 0);
                }
            });
        });
    }

    function ensurePythonMode() {
        if (pythonModeReady) return pythonModeReady;
        // Expose CodeMirror globally so cm-python.min.js can call CodeMirror.defineMode()
        window.CodeMirror = easyMDE.codemirror.constructor;
        pythonModeReady = new Promise(resolve => {
            const s = document.createElement('script');
            s.src = '/static/cm-python.min.js';
            s.onload = resolve;
            document.head.appendChild(s);
        });
        return pythonModeReady;
    }

    async function initCodeEditor() {
        await ensurePythonMode();
        const CM = easyMDE.codemirror.constructor;
        cmEditor = CM(document.getElementById('cm-editor'), {
            mode: 'python',
            lineNumbers: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            lineWrapping: true,
            autofocus: false,
            extraKeys: { Tab: cm => cm.execCommand('insertSoftTab') },
        });
        cmEditor.on('change', onEditorChange);
    }

    function onEditorChange() {
        if (loading || !currentFile) return;
        tabs.get(currentFile).dirty = true;
        renderTabs();
        setSaveStatus('● не сохранено', '#f38ba8');
        clearTimeout(draftTimer);
        draftTimer = setTimeout(() => {
            if (currentFile) persistDraft(currentFile, getEditorValue());
        }, 800);
    }

    function getEditorValue() {
        if (!currentFile) return '';
        if (isMd(currentFile)) return easyMDE.value();
        if (isDrawio(currentFile)) return tabs.get(currentFile)?.content || '';
        return cmEditor.getValue();
    }

    // ── Open / switch ─────────────────────────────────────────────────────────
    async function openFile(path) {
        if (tabs.has(path)) { switchTo(path); return; }
        try {
            const resp = await fetch('/notepad/file?path=' + encodeURIComponent(path));
            if (!resp.ok) throw new Error(resp.statusText);
            const data = await resp.json();
            const draft = getDraft(path);
            if (draft !== null) {
                tabs.set(path, { content: draft, mtime: data.mtime, dirty: true, history: null });
            } else {
                tabs.set(path, { content: data.content, mtime: data.mtime, dirty: false, history: null });
            }
            switchTo(path);
        } catch (e) { alert('Ошибка загрузки: ' + e.message); }
    }

    async function switchTo(path) {
        if (!tabs.has(path)) return;

        // Flush current editor state
        if (currentFile && tabs.has(currentFile)) {
            const cur = tabs.get(currentFile);
            if (isMd(currentFile) && easyMDE) {
                cur.content = easyMDE.value();
                cur.history = easyMDE.codemirror.getHistory();
                cur.scrollInfo = easyMDE.codemirror.getScrollInfo();
            } else if (cmEditor) {
                cur.content = cmEditor.getValue();
                cur.history = cmEditor.getHistory();
                cur.scrollInfo = cmEditor.getScrollInfo();
            }
        }

        dismissNotification();
        currentFile = path;
        const tab = tabs.get(path);

        // Show correct editor panel
        const mdWrapper = document.getElementById('md-wrapper');
        const pyWrapper = document.getElementById('py-wrapper');
        const drawioWrapper = document.getElementById('drawio-wrapper');
        document.getElementById('empty-state').style.display = 'none';

        if (isMd(path)) {
            mdWrapper.style.display = 'flex';
            pyWrapper.style.display = 'none';
            drawioWrapper.style.display = 'none';
            loading = true;
            easyMDE.value(tab.content);
            if (tab.history) easyMDE.codemirror.setHistory(tab.history);
            else easyMDE.codemirror.clearHistory();
            loading = false;
            requestAnimationFrame(() => {
                const si = tab.scrollInfo;
                easyMDE.codemirror.scrollTo(si ? si.left : 0, si ? si.top : 0);
            });
        } else if (isDrawio(path)) {
            drawioWrapper.style.display = 'flex';
            mdWrapper.style.display = 'none';
            pyWrapper.style.display = 'none';
            if (!drawioReady && !drawioInitializing) {
                initDrawioFrame();
                // init event handler will call sendDrawioLoad with currentFile's content
            } else if (drawioReady) {
                sendDrawioLoad(path, tab.content);
            }
            // if initializing: init handler fires after load, uses currentFile
        } else {
            pyWrapper.style.display = 'flex';
            mdWrapper.style.display = 'none';
            drawioWrapper.style.display = 'none';
            if (!cmEditor) await initCodeEditor();
            cmEditor.setOption('mode', isPy(path) ? 'python' : 'text/plain');
            loading = true;
            cmEditor.setValue(tab.content);
            if (tab.history) cmEditor.setHistory(tab.history);
            else cmEditor.clearHistory();
            loading = false;
            requestAnimationFrame(() => {
                cmEditor.refresh();
                requestAnimationFrame(() => {
                    const si = tab.scrollInfo;
                    if (si) cmEditor.scrollTo(si.left, si.top);
                });
            });
        }

        document.getElementById('save-btn').disabled = false;
        document.getElementById('download-btn').disabled = false;
        setSaveStatus(tab.dirty ? '● не сохранено' : '✓ сохранено',
                      tab.dirty ? '#f38ba8' : '#a6e3a1');
        renderTabs();
        highlightFileInTree(path);
        startWatch(path);
        persistSession();
    }

    function closeTab(path, event) {
        event.stopPropagation();
        tabs.delete(path);
        clearDraft(path);

        if (currentFile === path) {
            stopWatch();
            const remaining = [...tabs.keys()];
            if (remaining.length > 0) {
                switchTo(remaining[remaining.length - 1]);
            } else {
                currentFile = null;
                document.getElementById('empty-state').style.display = 'flex';
                document.getElementById('md-wrapper').style.display = 'none';
                document.getElementById('py-wrapper').style.display = 'none';
                document.getElementById('drawio-wrapper').style.display = 'none';
                document.getElementById('save-btn').disabled = true;
                document.getElementById('download-btn').disabled = true;
                setSaveStatus('', '');
                highlightFileInTree(null);
                renderTabs();
                persistSession();
            }
        } else {
            renderTabs();
            persistSession();
        }
    }

    // ── Tab bar ───────────────────────────────────────────────────────────────
    function renderTabs() {
        const bar = document.getElementById('tab-bar');
        bar.innerHTML = '';
        for (const [path, state] of tabs) {
            const name = path.split('/').pop();
            const div = document.createElement('div');
            div.className = 'tab' + (path === currentFile ? ' active' : '');
            div.onclick = () => switchTo(path);
            div.title = path;

            if (state.dirty) {
                const dot = document.createElement('span');
                dot.className = 'tab-dirty';
                dot.textContent = '●';
                div.appendChild(dot);
            }
            const icon = document.createElement('span');
            icon.textContent = fileIcon(name);
            div.appendChild(icon);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'tab-name';
            nameSpan.textContent = name;
            div.appendChild(nameSpan);

            const closeBtn = document.createElement('button');
            closeBtn.className = 'tab-close';
            closeBtn.textContent = '✕';
            closeBtn.title = 'Закрыть';
            closeBtn.onclick = (e) => closeTab(path, e);
            div.appendChild(closeBtn);

            bar.appendChild(div);
        }
        const active = bar.querySelector('.tab.active');
        if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    // ── Save ──────────────────────────────────────────────────────────────────
    async function saveFile() {
        if (!currentFile) return;
        const content = getEditorValue();
        try {
            const resp = await fetch('/notepad/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: currentFile, content })
            });
            if (!resp.ok) throw new Error(resp.statusText);
            const saved = await resp.json();
            tabs.get(currentFile).dirty = false;
            tabs.get(currentFile).content = content;
            tabs.get(currentFile).mtime = saved.mtime;
            clearDraft(currentFile);
            renderTabs();
            setSaveStatus('✓ сохранено', '#a6e3a1');
        } catch (e) { setSaveStatus('✕ ошибка!', '#f38ba8'); }
    }

    // ── Sync toggle ───────────────────────────────────────────────────────────
    function applySyncState() {
        const btn = document.getElementById('sync-btn');
        btn.classList.toggle('active', syncEnabled);
        btn.title = syncEnabled ? 'Синхронизация включена (нажмите чтобы выключить)' : 'Синхронизация выключена (нажмите чтобы включить)';
        localStorage.setItem(LS + 'sync', syncEnabled ? '1' : '0');
        if (syncEnabled && currentFile) {
            startWatch(currentFile);
        } else {
            stopWatch();
        }
    }
    function toggleSync() {
        syncEnabled = !syncEnabled;
        applySyncState();
    }

    // ── Disk polling (every 10s) ──────────────────────────────────────────────
    let pollTimer = null;

    function startWatch(path) {
        stopWatch();
        if (!syncEnabled) return;
        pollTimer = setInterval(() => checkDiskChange(path), 10000);
    }

    function stopWatch() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function checkDiskChange(path) {
        if (currentFile !== path) { stopWatch(); return; }
        const tab = tabs.get(path);
        if (!tab) { stopWatch(); return; }
        try {
            const resp = await fetch('/notepad/mtime?path=' + encodeURIComponent(path));
            if (!resp.ok) return;
            const { mtime } = await resp.json();
            if (tab.mtime === undefined) { tab.mtime = mtime; return; }
            if (mtime === tab.mtime) return;
            // File changed — fetch content
            const r2 = await fetch('/notepad/file?path=' + encodeURIComponent(path));
            if (!r2.ok) return;
            const { content, mtime: newMtime } = await r2.json();
            tab.mtime = newMtime;
            if (tab.dirty) {
                pendingDiskContent = content;
                document.getElementById('notification').classList.remove('hidden');
            } else {
                applyDiskContent(path, content);
            }
        } catch (e) {}
    }

    // ── Disk notification ─────────────────────────────────────────────────────
    function applyDiskContent(path, content) {
        const tab = tabs.get(path);
        if (!tab) return;
        tab.content = content;
        tab.dirty = false;
        clearDraft(path);
        if (path === currentFile) {
            loading = true;
            if (isMd(path) && easyMDE) {
                const si = easyMDE.codemirror.getScrollInfo();
                easyMDE.value(content);
                easyMDE.codemirror.clearHistory();
                requestAnimationFrame(() => easyMDE.codemirror.scrollTo(si.left, si.top));
            } else if (isDrawio(path) && drawioReady) {
                sendDrawioLoad(path, content);
            } else if (cmEditor) {
                const si = cmEditor.getScrollInfo();
                cmEditor.setValue(content);
                cmEditor.clearHistory();
                requestAnimationFrame(() => requestAnimationFrame(() => cmEditor.scrollTo(si.left, si.top)));
            }
            loading = false;
            renderTabs();
            setSaveStatus('↻ обновлено с диска', '#89b4fa');
        }
    }
    function reloadFromDisk() {
        if (pendingDiskContent === null) return;
        applyDiskContent(currentFile, pendingDiskContent);
        pendingDiskContent = null;
        dismissNotification();
    }
    function dismissNotification() {
        document.getElementById('notification').classList.add('hidden');
        pendingDiskContent = null;
    }

    // ── Create file ───────────────────────────────────────────────────────────
    function showNewFileForm() {
        document.getElementById('new-file-row').classList.remove('hidden');
        const inp = document.getElementById('new-file-input');
        inp.value = ''; inp.focus();
    }
    function cancelNewFile() { document.getElementById('new-file-row').classList.add('hidden'); }
    function handleNewFileKey(e) {
        if (e.key === 'Enter') createFile();
        if (e.key === 'Escape') cancelNewFile();
    }
    async function createFile() {
        let name = document.getElementById('new-file-input').value.trim();
        if (!name) return;
        if (!name.toLowerCase().match(/\.(md|txt|py|puml|drawio)$/)) name += '.md';
        cancelNewFile();

        if (document.querySelector(`.file-item[data-path="${name}"]`)) {
            openFile(name); return;
        }
        const emptyContent = isDrawio(name)
            ? '<mxGraphModel><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel>'
            : '';
        try {
            const resp = await fetch('/notepad/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: name, content: emptyContent })
            });
            if (!resp.ok) throw new Error(resp.statusText);

            // Add to tree dynamically
            ALL_FILES.push(name);
            initTree();

            tabs.set(name, { content: emptyContent, dirty: false, history: null });
            switchTo(name);
        } catch (e) { alert('Ошибка создания: ' + e.message); }
    }

    // ── Session restore ───────────────────────────────────────────────────────
    async function restoreSession() {
        const savedPaths = JSON.parse(localStorage.getItem(LS + 'tabs') || '[]');
        const savedCurrent = localStorage.getItem(LS + 'current');
        for (const path of savedPaths) {
            if (tabs.has(path)) continue;
            try {
                const resp = await fetch('/notepad/file?path=' + encodeURIComponent(path));
                if (!resp.ok) continue;
                const data = await resp.json();
                const draft = getDraft(path);
                tabs.set(path, draft !== null
                    ? { content: draft, mtime: data.mtime, dirty: true, history: null }
                    : { content: data.content, mtime: data.mtime, dirty: false, history: null });
            } catch (e) {}
        }
        if (tabs.size > 0) {
            const toOpen = (savedCurrent && tabs.has(savedCurrent)) ? savedCurrent : [...tabs.keys()][0];
            switchTo(toOpen);
        } else {
            renderTabs();
        }
    }

    // ── Sidebar ───────────────────────────────────────────────────────────────
    function toggleSidebar() {
        sidebarCollapsed = !sidebarCollapsed;
        document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
        document.getElementById('toggle-sidebar').textContent = sidebarCollapsed ? '→' : '←';
        document.getElementById('sidebar-toggle-float').classList.toggle('visible', sidebarCollapsed);
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function downloadFile() {
        if (!currentFile) return;
        const content = getEditorValue();
        const filename = currentFile.split('/').pop();
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    function setSaveStatus(text, color) {
        const el = document.getElementById('save-status');
        el.textContent = text;
        el.style.color = color || 'rgba(255,255,255,0.8)';
    }

    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
    });

    // ── Boot ──────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
        applyTheme(localStorage.getItem(LS + 'theme') || 'dark');
        syncEnabled = localStorage.getItem(LS + 'sync') === '1';
        applySyncState();
        if (sidebarCollapsed) {
            document.getElementById('sidebar').classList.add('collapsed');
            document.getElementById('toggle-sidebar').textContent = '→';
            document.getElementById('sidebar-toggle-float').classList.add('visible');
        }
        initTree();
        // Always init EasyMDE so CodeMirror class is available for the Python editor.
        initMdEditor();
        restoreSession();
    });
    </script>
