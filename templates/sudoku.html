<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судоку</title>
    <link rel="stylesheet" href="/static/sudoku.css">
</head>
<body>
    <div class="container">
        <h1>Судоку</h1>

        <div class="controls">
            <select id="difficulty">
                <option value="easy">Легкий</option>
                <option value="medium" selected>Средний</option>
                <option value="hard">Сложный</option>
                <option value="expert">Эксперт</option>
            </select>
            <button id="new-game">Новая</button>
            <button id="check-solution">Проверить</button>
            <button id="toggle-notes">Заметки</button>
            <button id="auto-fill-notes">Авто</button>
        </div>

        <div class="game-container">
            <div class="sudoku-grid" id="sudoku-grid"></div>
            <!-- Индикаторы появятся здесь через JS -->
        </div>

        <div class="status" id="status"></div>
        <div class="notes-info" id="notes-info"></div>
    </div>

    <script src="/static/sudoku.js"></script>
</body>
</html>
