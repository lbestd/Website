<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <style>
        :root {
            --bg:       #1e1e2e;
            --bg-alt:   #181825;
            --surface0: #313244;
            --surface1: #45475a;
            --surface2: #585b70;
            --overlay0: #6c7086;
            --subtext0: #a6adc8;
            --text:     #e9ecf6;
            --mauve:    #cba6f7;
            --red:      #f38ba8;
            --green:    #a6e3a1;
            --blue:     #89b4fa;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--bg-alt);
            border: 1px solid var(--surface0);
            border-radius: 14px;
            padding: 40px 36px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            font-size: 36px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 28px;
        }

        .error {
            background: rgba(243,139,168,0.15);
            border: 1px solid var(--red);
            color: var(--red);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--subtext0);
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: var(--surface0);
            border: 1px solid var(--surface1);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 13px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
            margin-bottom: 16px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--mauve);
        }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            transition: opacity 0.15s;
        }

        button[type="submit"]:hover { opacity: 0.88; }
        button[type="submit"]:active { opacity: 0.75; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔐</div>
        <h1>Вход</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/x/in" autocomplete="on">
            <input type="hidden" name="next" value="{{ next }}">

            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" required autofocus>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>

            <button type="submit">Войти</button>
        </form>
    </div>
</body>
</html>
